<!doctype html>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0} body{background:#FFFFFF} svg{display:block}
  text{font-family:'Segoe UI',Arial,sans-serif}
  .mono{font-family:Consolas,'Courier New',monospace}
</style>
<svg width="1320" height="638" viewBox="0 0 1760 850" xmlns="http://www.w3.org/2000/svg">
  <text x="120" y="60" class="mono" font-size="32" letter-spacing="6" fill="#E7896D">SHOT RHYTHM · RULE ZERO</text>
  <text x="120" y="110" font-size="42" font-weight="700" fill="#16201C">One beat of script is 3-5 shots, not one · mean shot 2.0s</text>

  <!-- timeline: 8s = 1520px, x 120..1640, tiles y 160..500 -->
  <!-- shot 1: TITLE 1.5s = 285px -->
  <rect x="120" y="160" width="285" height="340" fill="#F9F9F9" stroke="#16201C" stroke-width="2.5"/>
  <text x="262" y="255" font-size="34" font-weight="800" fill="#16201C" text-anchor="middle">#2</text>
  <text x="262" y="300" font-size="30" font-style="italic" font-weight="700" font-family="Georgia,serif" fill="#E7896D" text-anchor="middle">Name</text>
  <rect x="232" y="330" width="60" height="60" rx="10" fill="#FFFFFF" stroke="#16201C" stroke-width="1.5"/>
  <text x="262" y="440" font-size="22" font-weight="700" fill="#16201C" text-anchor="middle">&#9733; 21.9k</text>

  <!-- shot 2: CARD 2.2s = 418px -->
  <rect x="405" y="160" width="418" height="340" fill="#F4F5F1" stroke="#16201C" stroke-width="2.5"/>
  <rect x="465" y="220" width="298" height="180" rx="10" fill="#FFFFFF" stroke="#6E7A73" stroke-width="1.5"/>
  <line x1="485" y1="260" x2="743" y2="260" stroke="#6E7A73" stroke-width="6" opacity="0.4"/>
  <line x1="485" y1="295" x2="700" y2="295" stroke="#6E7A73" stroke-width="6" opacity="0.3"/>
  <line x1="485" y1="330" x2="720" y2="330" stroke="#6E7A73" stroke-width="6" opacity="0.3"/>
  <text x="614" y="450" font-size="22" font-weight="700" fill="#16201C" text-anchor="middle">screenshot, held</text>

  <!-- shot 3: SWEEP 2.3s = 437px -->
  <rect x="823" y="160" width="437" height="340" fill="#F4F5F1" stroke="#16201C" stroke-width="2.5"/>
  <rect x="883" y="220" width="317" height="180" rx="10" fill="#FFFFFF" stroke="#6E7A73" stroke-width="1.5"/>
  <circle cx="950" cy="310" r="26" fill="#6E7A73" opacity="0.45"/>
  <circle cx="1030" cy="310" r="26" fill="#6E7A73" opacity="0.45"/>
  <circle cx="1110" cy="310" r="26" fill="#6E7A73" opacity="0.45"/>
  <line x1="930" y1="370" x2="1150" y2="370" stroke="#E7896D" stroke-width="4" marker-end="url(#sweeparrow)"/>
  <defs><marker id="sweeparrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#E7896D"/></marker></defs>
  <text x="1041" y="450" font-size="22" font-weight="700" fill="#16201C" text-anchor="middle">zoom + track over it</text>

  <!-- shot 4: SPLIT 2.0s = 380px -->
  <rect x="1260" y="160" width="380" height="340" fill="#0B0D0C" stroke="#16201C" stroke-width="2.5"/>
  <rect x="1310" y="195" width="280" height="120" rx="10" fill="#F4F5F1"/>
  <rect x="1330" y="340" width="240" height="160" rx="12" fill="#16201C" stroke="#C8C0B0" stroke-width="1"/>
  <circle cx="1450" cy="395" r="30" fill="#6E7A73"/>
  <path d="M 1395 500 q 0 -55 55 -55 q 55 0 55 55 z" fill="#6E7A73"/>
  <text x="1450" y="478" font-size="20" font-weight="700" fill="#F5F0E8" text-anchor="middle" opacity="0"> </text>

  <!-- cut markers -->
  <line x1="405" y1="140" x2="405" y2="520" stroke="#E7896D" stroke-width="3"/>
  <line x1="823" y1="140" x2="823" y2="520" stroke="#E7896D" stroke-width="3"/>
  <line x1="1260" y1="140" x2="1260" y2="520" stroke="#E7896D" stroke-width="3"/>
  <text x="405" y="132" class="mono" font-size="20" fill="#E7896D" text-anchor="middle">cut</text>
  <text x="823" y="132" class="mono" font-size="20" fill="#E7896D" text-anchor="middle">cut</text>
  <text x="1260" y="132" class="mono" font-size="20" fill="#E7896D" text-anchor="middle">cut</text>

  <!-- labels under tiles -->
  <text x="262"  y="545" class="mono" font-size="24" fill="#16201C" text-anchor="middle">TITLE · 1.5s</text>
  <text x="262"  y="580" class="mono" font-size="20" fill="#6E7A73" text-anchor="middle">no face · always #F9F9F9</text>
  <text x="614"  y="545" class="mono" font-size="24" fill="#16201C" text-anchor="middle">CARD · 2.2s</text>
  <text x="614"  y="580" class="mono" font-size="20" fill="#6E7A73" text-anchor="middle">no face · ground free</text>
  <text x="1041" y="545" class="mono" font-size="24" fill="#16201C" text-anchor="middle">SWEEP · 2.3s</text>
  <text x="1041" y="580" class="mono" font-size="20" fill="#6E7A73" text-anchor="middle">no face · one move per screenshot</text>
  <text x="1450" y="545" class="mono" font-size="24" fill="#16201C" text-anchor="middle">SPLIT · 2.0s</text>
  <text x="1450" y="580" class="mono" font-size="20" fill="#6E7A73" text-anchor="middle">face · always #050706 + grain</text>

  <!-- ruler -->
  <line x1="120" y1="625" x2="1640" y2="625" stroke="#6E7A73" stroke-width="2"/>
  <g class="mono" font-size="20" fill="#6E7A73">
    <line x1="120"  y1="618" x2="120"  y2="632" stroke="#6E7A73" stroke-width="2"/><text x="120"  y="662" text-anchor="middle">0s</text>
    <line x1="310"  y1="618" x2="310"  y2="632" stroke="#6E7A73" stroke-width="2"/><text x="310"  y="662" text-anchor="middle">1s</text>
    <line x1="500"  y1="618" x2="500"  y2="632" stroke="#6E7A73" stroke-width="2"/><text x="500"  y="662" text-anchor="middle">2s</text>
    <line x1="690"  y1="618" x2="690"  y2="632" stroke="#6E7A73" stroke-width="2"/><text x="690"  y="662" text-anchor="middle">3s</text>
    <line x1="880"  y1="618" x2="880"  y2="632" stroke="#6E7A73" stroke-width="2"/><text x="880"  y="662" text-anchor="middle">4s</text>
    <line x1="1070" y1="618" x2="1070" y2="632" stroke="#6E7A73" stroke-width="2"/><text x="1070" y="662" text-anchor="middle">5s</text>
    <line x1="1260" y1="618" x2="1260" y2="632" stroke="#6E7A73" stroke-width="2"/><text x="1260" y="662" text-anchor="middle">6s</text>
    <line x1="1450" y1="618" x2="1450" y2="632" stroke="#6E7A73" stroke-width="2"/><text x="1450" y="662" text-anchor="middle">7s</text>
    <line x1="1640" y1="618" x2="1640" y2="632" stroke="#6E7A73" stroke-width="2"/><text x="1640" y="662" text-anchor="middle">8s</text>
  </g>
  <text x="880" y="662" text-anchor="middle"> </text>
  <text x="1640" y="662" text-anchor="middle"> </text>

  <!-- footnotes -->
  <text x="120" y="730" font-size="28" fill="#16201C">&#8226; Mean shot <tspan font-weight="700">2.0s</tspan>, range 0.26-3.43s. Every cut lands on a caption boundary, never mid-word.</text>
  <text x="120" y="772" font-size="28" fill="#16201C">&#8226; The face is absent in roughly <tspan font-weight="700">half</tspan> the shots. If it is in every frame, there are not enough shots.</text>
  <text x="120" y="814" font-size="28" fill="#16201C">&#8226; When the edit feels flat, the answer is almost always another cut with a different composition.</text>
</svg>
