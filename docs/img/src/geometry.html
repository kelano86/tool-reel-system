  <line x1="440" y1="850" x2="1320" y2="850" stroke="#E7896D" stroke-width="3" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text x="880" y="890" class="mono" font-size="28" fill="#E7896D" text-anchor="middle">880 max · in pixels, never %</text>

  <!-- footnotes -->
  <text x="340" y="2172" font-size="30" fill="#16201C">&#8226; Top-zone formula: wrapper <tspan class="mono" font-size="27">absolute inset-0 flex center</tspan> · content <tspan class="mono" font-size="27">width &#8804; 880, border-box</tspan>.</text>
  <text x="340" y="2214" font-size="30" fill="#16201C">&#8226; A bare element does not centre, it <tspan font-weight="700">pins to the top-left</tspan>. The wrapper does the centring.</text>
  <text x="340" y="2256" font-size="30" fill="#16201C">&#8226; Percentages resolve against the 883px zone, not the frame — pass frame positions in pixels.</text>
