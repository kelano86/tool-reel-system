<!doctype html>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0} body{background:#FFFFFF} svg{display:block}
  text{font-family:'Segoe UI',Arial,sans-serif}
  .mono{font-family:Consolas,'Courier New',monospace}
</style>
<svg width="1320" height="1695" viewBox="0 0 1760 2260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6E7A73"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="0" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#6E7A73"/></marker>
  </defs>

  <text x="340" y="70" class="mono" font-size="34" letter-spacing="6" fill="#E7896D">THE POP-OUT FACE SHOT · OPTIONAL VARIANT</text>
  <text x="340" y="122" font-size="44" font-weight="700" fill="#16201C">Two copies of the same footage — not a crop</text>

  <!-- frame, dark -->
  <rect x="340" y="160" width="1080" height="1920" fill="#0B0D0C" stroke="#16201C" stroke-width="3"/>

  <!-- upper content placeholder -->
  <rect x="440" y="360" width="880" height="560" rx="28" fill="none" stroke="#C8C0B0" stroke-width="2" stroke-dasharray="12 9" opacity="0.6"/>
  <text x="880" y="650" class="mono" font-size="28" fill="#C8C0B0" text-anchor="middle" opacity="0.8">content above · B-roll, headline, whatever the beat needs</text>

  <!-- LAYER 1: the card (straight top edge) -->
  <path d="M 409 1612 q 0 -46 46 -46 h 850 q 46 0 46 46 v 468 h -942 z" fill="#16201C" stroke="#C8C0B0" stroke-width="1.5"/>
  <path d="M 620 2080 q 0 -260 260 -260 q 260 0 260 260 z" fill="#6E7A73" opacity="0.55"/>
  <!-- LAYER 2: cutout head drawn ON TOP, overlapping the edge -->
  <circle cx="880" cy="1620" r="165" fill="#6E7A73"/>
  <path d="M 620 2080 q 0 -260 260 -260 q 260 0 260 260 z" fill="#6E7A73"/>
  <text x="880" y="1920" class="mono" font-size="28" fill="#F9F9F9" text-anchor="middle">CARD · 942 wide @ (69, 1406) · r 46</text>
  <text x="880" y="1960" class="mono" font-size="24" fill="#F9F9F9" text-anchor="middle" opacity="0.75">bleeds past the frame bottom</text>

  <!-- card edge line -->
  <line x1="340" y1="1566" x2="620" y2="1566" stroke="#E7896D" stroke-width="3" stroke-dasharray="12 8"/>
  <line x1="1140" y1="1566" x2="1420" y2="1566" stroke="#E7896D" stroke-width="3" stroke-dasharray="12 8"/>
  <line x1="270" y1="1566" x2="340" y2="1566" stroke="#6E7A73" stroke-width="1.5"/>
  <text x="256" y="1558" class="mono" font-size="28" fill="#16201C" text-anchor="end">cardTop</text>
  <text x="256" y="1594" class="mono" font-size="22" fill="#6E7A73" text-anchor="end">y 1406</text>

  <!-- pop bracket -->
  <line x1="1090" y1="1455" x2="1090" y2="1566" stroke="#E7896D" stroke-width="2.5" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <line x1="1045" y1="1455" x2="1170" y2="1455" stroke="#6E7A73" stroke-width="1.5"/>
  <text x="1120" y="1500" class="mono" font-size="28" fill="#E7896D">pop</text>
  <text x="1120" y="1536" class="mono" font-size="24" fill="#E7896D">0.30 x head</text>

  <!-- layer explanation, right rail -->
  <rect x="1450" y="1150" width="290" height="200" rx="18" fill="#F4F5F1" stroke="#6E7A73" stroke-width="1.5"/>
  <text x="1470" y="1195" class="mono" font-size="26" fill="#E7896D">LAYER 2 · top</text>
  <text x="1470" y="1235" font-size="25" fill="#16201C">background-removed</text>
  <text x="1470" y="1268" font-size="25" fill="#16201C">copy, clipped to</text>
  <text x="1470" y="1301" font-size="25" fill="#16201C"><tspan class="mono">y &lt; cardTop</tspan> — this</text>
  <text x="1470" y="1334" font-size="25" fill="#16201C">is the whole effect</text>
  <line x1="1450" y1="1250" x2="1040" y2="1440" stroke="#6E7A73" stroke-width="1.5" stroke-dasharray="4 8"/>

  <rect x="1450" y="1400" width="290" height="170" rx="18" fill="#F4F5F1" stroke="#6E7A73" stroke-width="1.5"/>
  <text x="1470" y="1445" class="mono" font-size="26" fill="#E7896D">LAYER 1 · under</text>
  <text x="1470" y="1485" font-size="25" fill="#16201C">camera original,</text>
  <text x="1470" y="1518" font-size="25" fill="#16201C">clipped to the</text>
  <text x="1470" y="1551" font-size="25" fill="#16201C">rounded card</text>
  <line x1="1450" y1="1490" x2="1360" y2="1700" stroke="#6E7A73" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- why it reads -->
  <text x="372" y="1010" font-size="30" fill="#F5F0E8" opacity="0.9">Without layer 2 the head reads</text>
  <text x="372" y="1050" font-size="30" fill="#F5F0E8" opacity="0.9">against the room. With it, the head</text>
  <text x="372" y="1090" font-size="30" fill="#F5F0E8" opacity="0.9">sits in front of the card edge,</text>
  <text x="372" y="1130" font-size="30" fill="#F5F0E8" opacity="0.9">against the page ground.</text>

  <!-- footnotes -->
  <text x="340" y="2130" font-size="30" fill="#16201C">&#8226; Both layers: same transform, same timebase — bake the cutout at source resolution and fps.</text>
  <text x="340" y="2172" font-size="30" fill="#16201C">&#8226; Deep pop wants a short card: pop and zoom are locked together; the trade lands on head size.</text>
  <text x="340" y="2214" font-size="30" fill="#16201C">&#8226; Four footage measurements drive it all: <tspan font-weight="700">crown, eye, chin, centre</tspan>. Re-measure each shoot.</text>
  <text x="340" y="2256" font-size="30" fill="#16201C">&#8226; Cutout ships as VP9 WebM <tspan class="mono" font-size="27">yuva420p</tspan> with <tspan class="mono" font-size="27">-auto-alt-ref 0</tspan> — Chrome composites it transparently.</text>
</svg>
