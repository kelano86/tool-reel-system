<!doctype html>

<svg width="1320" height="1695" viewBox="0 0 1760 2260" xmlns="http://www.w3.org/2000/svg">

  <text x="340" y="122" font-size="44" font-weight="700" fill="#16201C">Reels UI chrome at 1080 x 1920</text>

  <!-- frame -->
  <rect x="340" y="160" width="1080" height="1920" fill="#F9F9F9" stroke="#16201C" stroke-width="3"/>

  <!-- chrome bands -->

  <text x="880" y="1888" class="mono" font-size="32" fill="#16201C" text-anchor="middle">450px</text>
  <text x="1372" y="1005" class="mono" font-size="28" fill="#16201C" text-anchor="middle" transform="rotate(-90 1372 1005)">LIKE / COMMENT / SHARE · 100px</text>
  <text x="359" y="1005" class="mono" font-size="26" fill="#16201C" text-anchor="middle" transform="rotate(-90 359 1005)">35px</text>

  <!-- usable zone -->
  <rect x="375" y="380" width="945" height="1250" fill="none" stroke="#16201C" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="395" y="430" class="mono" font-size="29" fill="#16201C">USABLE · x 35-980 · y 220-1470 · 945 x 1250</text>

  <!-- centred width -->
  <line x1="440" y1="380" x2="440" y2="1630" stroke="#E7896D" stroke-width="3" stroke-dasharray="8 10"/>
  <line x1="1320" y1="380" x2="1320" y2="1630" stroke="#E7896D" stroke-width="3" stroke-dasharray="8 10"/>
  <line x1="880" y1="500" x2="880" y2="1630" stroke="#6E7A73" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.6"/>
  <line x1="440" y1="620" x2="1320" y2="620" stroke="#E7896D" stroke-width="3" marker-start="url(#a2)" marker-end="url(#a1)"/>

  <text x="880" y="1508" font-size="42" font-weight="800" fill="#16201C" text-anchor="middle">lowest caption centre</text>

  <line x1="270" y1="2080" x2="340" y2="2080" stroke="#6E7A73" stroke-width="1.5"/>

  <text x="1500" y="1551" class="mono" font-size="22" fill="#6E7A73">(0.71H · LOW_CAPTION)</text>
  <text x="1500" y="1583" class="mono" font-size="22" fill="#6E7A73">2-line budget ~208px</text>

  <!-- top dims -->
  <line x1="340" y1="130" x2="375" y2="130" stroke="#6E7A73" stroke-width="2.5"/>
  <text x="357" y="152" class="mono" font-size="22" fill="#16201C" text-anchor="middle">35</text>
  <line x1="1320" y1="130" x2="1420" y2="130" stroke="#6E7A73" stroke-width="2.5" marker-start="url(#a2)" marker-end="url(#a1)"/>
  <text x="1370" y="152" class="mono" font-size="22" fill="#16201C" text-anchor="middle">100</text>

  <!-- footnotes -->
  <text x="340" y="2148" font-size="30" fill="#16201C">&#8226; <tspan font-weight="700">No text outside the usable zone, ever.</tspan> Video and B-roll may bleed; readable things may not.</text>
  <text x="340" y="2190" font-size="30" fill="#16201C">&#8226; Hand animations <tspan class="mono" font-size="27">SAFE_CENTRED_W</tspan> (880) as their box width, not the frame width.</text>
  <text x="340" y="2232" font-size="30" fill="#16201C">&#8226; Shadows may sit in the rail; text may not. Measure rendered frames — Studio draws no chrome.</text>
